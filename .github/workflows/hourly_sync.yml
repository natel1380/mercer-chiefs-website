name: Mercer Chiefs Automated Data & Social Sync

on:
  schedule:
    # Runs automatically twice an hour at off-peak minutes (14 and 44) to bypass GitHub queue delays
    - cron: '14,44 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from the GitHub Actions tab or Admin dashboard
    inputs:
      hidden_teams:
        description: 'JSON array of hidden team IDs'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update Site Config from Input
        if: ${{ github.event.inputs.hidden_teams != '' }}
        run: |
          node -e "
          const fs = require('fs');
          const hidden = JSON.parse(process.env.INPUT_HIDDEN || '[]');
          const p = 'data/site-config.json';
          let cfg = { seasonLabel: '2026/27', hiddenTeams: [] };
          try { cfg = JSON.parse(fs.readFileSync(p, 'utf8')); } catch(e){}
          cfg.hiddenTeams = hidden;
          fs.writeFileSync(p, JSON.stringify(cfg, null, 2), 'utf8');
          console.log('[CONFIG] Saved hidden teams to data/site-config.json:', hidden);
          "
        env:
          INPUT_HIDDEN: ${{ github.event.inputs.hidden_teams }}

      - name: Run Hourly Autonomous Data Sync
        env:
          MERCER_FB_TOKEN: ${{ secrets.MERCER_FB_TOKEN }}
        run: node sync_all_data.js

      - name: Commit and Push Updated Data Feeds
        run: |
          git config --global user.name "Mercer Chiefs Bot"
          git config --global user.email "bot@mercerchiefshockey.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/
            git commit -m "chore: automated hourly feed update"
            git push
            echo "Changes pushed to repository."
          else
            echo "No data changes detected. Everything up to date."
          fi

      - name: Deploy to Web Server via FTP (Optional)
        if: ${{ env.FTP_SERVER != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR || '/' }}
          dangerous-clean-slate: false
